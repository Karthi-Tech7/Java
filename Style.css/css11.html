<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Properties</title>
    <style>
        a{
            display: block;
        }
        /* h1{
            display:none;
        } */
        #wrapper{
            border: 2px solid red;
            text-align: center;
        }
        ol{
            background-color: lightblue;
            height:50px;
        }
        li{
            background-color: lightgreen;
            display: inline-block;
            padding: 0 10px;
            height: 30px;
            line-height: 3px;
        }
        li{
            list-style-type: none;
        }
        li:hover{
            background-color: lightcoral;
            color:blueviolet;
        }
        p{
            margin: 20px auto;
            padding:  10px;
            width: 100px;
            height: 100px;
            border: 2px solid black;
            text-align: center;
        }
        #top{
            box-shadow: 10px 10px 5px grey;
            border-radius:10px;
            
        }
        #Br{
            box-shadow: 0 -10px 5px grey;
            border-radius:10px 0 10px 0;
        }
        #Brs{
            box-shadow: -10px -10px 5px 5px grey;
            border-radius:0 10px 0 10px;
        }
        #Os{
            box-shadow: 10px 10px 5px 5px grey;
            border-radius:10px 20px;
        }
        #i{
            box-shadow: inset 10px 10px 5px grey;
            border-radius:100px;
        }
    </style>
</head>
<body>
    <h1>Display Properties</h1>
    <a href="#">Hello</a>
    <a href="#">World</a>
    <div id="wrapper">
        <ol>
            <li>Block</li>
            <li>Inline</li>
            <li>Inline-block</li>
        </ol>
    </div><hr>
    <h1>Box shadow</h1>
    <h1> border-radius</h1>
    <p id="top">Top left</p>
    <p id="Br">Bottom right</p>
    <p id="Brs">Bottom right spread</p>
    <p id="Os">Outer spread</p>
    <p id="i">Insert</p>

</body>
</html>
