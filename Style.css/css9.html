<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #s{
           
            border: thick solid red;
            padding: 20px;
            text-align: center;
            position: static;
            font-size: 50px;
        }
        #r{
            font-size: 50px;
            border: thick dotted green;
            padding: 20px;
            position: relative;
            text-align: center;
        }
        #a{
            text-align: center;
            border: thick groove darkblue;
            font-size: 50px;
            padding: 20px;
            position: absolute;

        }
        #f{
            
            border: thick dashed darkcyan;
            padding: 20px;
            position: fixed;
            right: 50px;
            bottom: 50px;
            background-color: blueviolet;

        }
        #s{
            text-align: center;
            border: thick double darkorange;
            padding: 20px;
            font-size: 50px;
            position: sticky;

        }
    </style>
</head>
<body>
    <h1>Positions:</h1>
    <div>
        <p id="s">Static</p>
        <p id="r">relative</p>
        <p id="a">absolute</p><br>
        <hr>
        <p id="f">fixed</p>
        <br>
        <br>
        <br>
        <br><br><br>
        <p id="s">Sticky</p>

    </div>
</body>
</html>
